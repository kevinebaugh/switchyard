name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0   # build numbers are the commit count
      - name: Test
        run: swift test
      - name: Build the app (universal, ad-hoc signed)
        run: scripts/build-app.sh
